<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songo Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css">
<style>
:root{
  --ink:#14100C;
  --ink-2:#1C1710;
  --ink-3:#2A2318;
  --line:#3A301F;
  --gold:#D4A24C;
  --gold-lit:#F2C978;
  --cream:#EFE4D0;
  --dim:#8B7A5F;

  --px:6px;
  --py:9px;

  --pixel:"Galmuri11","Galmuri9",monospace;
  --body:"Pretendard Variable",Pretendard,-apple-system,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--ink);
  color:var(--cream);
  font-family:var(--body);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ============ 마퀴 헤더 ============ */
.marquee{
  border-bottom:2px solid var(--line);
  background:var(--ink-2);
  position:sticky;top:0;z-index:50;
}

.bulbs{
  display:flex;gap:var(--px);
  padding:7px 12px;
  overflow:hidden;
  justify-content:center;
}
.bulb{
  width:var(--px);height:var(--py);
  background:var(--ink-3);
  flex:0 0 auto;
  animation:chase 2.4s linear infinite;
}
@keyframes chase{
  0%,88%{background:var(--ink-3)}
  92%{background:var(--gold-lit)}
  100%{background:var(--ink-3)}
}

.bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  padding:14px 20px;
  max-width:1080px;margin:0 auto;width:100%;
}

.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.mark{display:block}
.brand-name{
  font-family:var(--pixel);
  font-size:15px;letter-spacing:.14em;
  color:var(--cream);
  line-height:1;
}
.brand-sub{
  font-size:10px;letter-spacing:.28em;
  color:var(--dim);margin-top:5px;
}

.btn-list{
  font-family:var(--pixel);
  font-size:12px;letter-spacing:.08em;
  color:var(--gold);
  background:transparent;
  border:2px solid var(--line);
  padding:11px 16px;
  cursor:pointer;
  line-height:1;
}
.btn-list:hover{border-color:var(--gold);background:var(--ink-3)}
.btn-list:focus-visible{outline:2px solid var(--gold-lit);outline-offset:2px}

/* ============ 게임 영역 ============ */
main{
  flex:1;
  max-width:1080px;margin:0 auto;width:100%;
  padding:44px 20px 0;
}

.eyebrow{
  font-family:var(--pixel);
  font-size:11px;letter-spacing:.2em;
  color:var(--gold);
  margin-bottom:14px;
}

.game-title{
  font-family:var(--pixel);
  font-size:clamp(26px,6vw,40px);
  line-height:1.35;
  letter-spacing:.02em;
  margin-bottom:14px;
}

.game-desc{
  font-size:15px;line-height:1.75;
  color:var(--dim);
  max-width:46ch;
  margin-bottom:36px;
}

/* 대결 */
.versus{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  margin-bottom:28px;
}

.card{
  background:var(--ink-2);
  border:2px solid var(--line);
  padding:32px 20px;
  text-align:center;
  cursor:pointer;
  font-family:inherit;
  color:inherit;
  transition:border-color .12s,background .12s;
}
.card:hover{border-color:var(--gold);background:var(--ink-3)}
.card:focus-visible{outline:2px solid var(--gold-lit);outline-offset:2px}
.card.picked{border-color:var(--gold-lit)}

.logo-slot{
  width:56px;height:56px;
  margin:0 auto 16px;
  border:2px solid var(--line);
  display:grid;place-items:center;
  font-family:var(--pixel);
  font-size:19px;
  color:var(--gold);
}
.co-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.co-meta{
  font-size:12px;color:var(--dim);
  margin-top:8px;
  font-variant-numeric:tabular-nums;
  min-height:16px;
}

.vs{
  font-family:var(--pixel);
  font-size:15px;
  color:var(--gold);
}

/* 상태바 */
.status{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  border-top:2px solid var(--line);
  padding-top:18px;
  margin-bottom:44px;
  flex-wrap:wrap;
}
.streak{
  font-family:var(--pixel);
  font-size:13px;
  color:var(--dim);
}
.streak b{color:var(--gold-lit);font-weight:400}

.btn-share{
  font-family:var(--pixel);
  font-size:12px;letter-spacing:.06em;
  background:var(--gold);
  color:var(--ink);
  border:none;
  padding:12px 18px;
  cursor:pointer;
  line-height:1;
}
.btn-share:hover{background:var(--gold-lit)}
.btn-share:focus-visible{outline:2px solid var(--cream);outline-offset:2px}

/* ============ 광고 ============ */
.ad{
  max-width:1080px;margin:0 auto 40px;width:100%;
  padding:0 20px;
}
.ad-inner{
  border:2px dashed var(--line);
  min-height:104px;
  display:grid;place-items:center;
  color:var(--ink-3);
  font-family:var(--pixel);
  font-size:11px;letter-spacing:.2em;
}

/* ============ 사이드 패널 ============ */
.scrim{
  position:fixed;inset:0;
  background:rgba(10,8,5,.72);
  opacity:0;pointer-events:none;
  transition:opacity .2s;
  z-index:60;
}
.scrim.on{opacity:1;pointer-events:auto}

.panel{
  position:fixed;top:0;right:0;bottom:0;
  width:min(340px,86vw);
  background:var(--ink-2);
  border-left:2px solid var(--line);
  transform:translateX(100%);
  transition:transform .24s cubic-bezier(.4,0,.2,1);
  z-index:70;
  display:flex;flex-direction:column;
}
.panel.on{transform:translateX(0)}

.panel-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px;
  border-bottom:2px solid var(--line);
}
.panel-title{
  font-family:var(--pixel);
  font-size:13px;letter-spacing:.14em;
  color:var(--cream);
}
.btn-x{
  background:none;border:none;cursor:pointer;
  color:var(--dim);font-size:22px;line-height:1;
  padding:4px 8px;
}
.btn-x:hover{color:var(--gold)}
.btn-x:focus-visible{outline:2px solid var(--gold-lit)}

.list{padding:12px 0;overflow-y:auto}

.item{
  display:block;width:100%;text-align:left;
  background:none;border:none;
  border-bottom:1px solid var(--ink-3);
  padding:18px 20px;
  cursor:pointer;
  font-family:inherit;color:inherit;
}
.item:hover{background:var(--ink-3)}
.item:focus-visible{outline:2px solid var(--gold-lit);outline-offset:-2px}
.item.live .item-name{color:var(--gold-lit)}
.item.soon{cursor:default;opacity:.42}
.item.soon:hover{background:none}

.item-name{
  font-family:var(--pixel);
  font-size:14px;
  line-height:1.5;
}
.item-tag{
  font-size:10px;letter-spacing:.18em;
  color:var(--dim);
  margin-top:8px;
}
.item.live .item-tag{color:var(--gold)}

footer{
  padding:20px;
  border-top:2px solid var(--line);
  font-size:11px;color:var(--dim);
  letter-spacing:.06em;
}

@media (max-width:560px){
  .versus{grid-template-columns:1fr;gap:10px}
  .vs{padding:4px 0}
  main{padding-top:32px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .bulb{background:var(--gold)}
}
</style>
</head>
<body>

<header class="marquee">
  <div class="bulbs" id="bulbs" aria-hidden="true"></div>
  <div class="bar">
    <a class="brand" href="#">
      <svg class="mark" width="42" height="30" viewBox="0 0 42 30" aria-label="Songo Studio">
        <g fill="#D4A24C">
          <rect x="3" y="0"  width="9" height="4"/><rect x="12" y="0" width="6" height="4"/>
          <rect x="0" y="4"  width="3" height="4"/><rect x="15" y="4" width="3" height="4"/>
          <rect x="0" y="8"  width="3" height="4"/>
          <rect x="3" y="12" width="9" height="4"/><rect x="12" y="12" width="6" height="4"/>
          <rect x="15" y="16" width="3" height="4"/>
          <rect x="0" y="20" width="3" height="4"/><rect x="15" y="20" width="3" height="4"/>
          <rect x="3" y="24" width="12" height="4"/>

          <rect x="27" y="0"  width="9" height="4"/><rect x="36" y="0" width="6" height="4"/>
          <rect x="24" y="4"  width="3" height="4"/><rect x="39" y="4" width="3" height="4"/>
          <rect x="24" y="8"  width="3" height="4"/>
          <rect x="27" y="12" width="9" height="4"/><rect x="36" y="12" width="6" height="4"/>
          <rect x="39" y="16" width="3" height="4"/>
          <rect x="24" y="20" width="3" height="4"/><rect x="39" y="20" width="3" height="4"/>
          <rect x="27" y="24" width="12" height="4"/>
        </g>
      </svg>
      <span>
        <div class="brand-name">SONGO STUDIO</div>
        <div class="brand-sub">디지털 에버랜드</div>
      </span>
    </a>
    <button class="btn-list" id="open">게임 목록</button>
  </div>
</header>

<main>
  <div class="eyebrow">지금 열린 게임</div>
  <h1 class="game-title">기업 배틀</h1>
  <p class="game-desc">
    이름과 로고만 보고 어느 쪽이 더 큰 기업인지 고르세요.
    매출과 직원 수를 합쳐 판정합니다. 틀리면 연승이 끊깁니다.
  </p>

  <div class="versus">
    <button class="card" data-side="a">
      <div class="logo-slot">A</div>
      <div class="co-name">넥슨</div>
      <div class="co-meta" data-meta></div>
    </button>
    <div class="vs">VS</div>
    <button class="card" data-side="b">
      <div class="logo-slot">B</div>
      <div class="co-name">크래프톤</div>
      <div class="co-meta" data-meta></div>
    </button>
  </div>

  <div class="status">
    <div class="streak">연승 <b id="streak">0</b></div>
    <button class="btn-share" id="share">결과 공유하기</button>
  </div>
</main>

<div class="ad">
  <div class="ad-inner">ADVERTISEMENT</div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-top">
    <div class="panel-title">게임 목록</div>
    <button class="btn-x" id="close" aria-label="닫기">×</button>
  </div>
  <div class="list">
    <button class="item live">
      <div class="item-name">기업 배틀</div>
      <div class="item-tag">지금 플레이 중</div>
    </button>
    <button class="item soon" disabled>
      <div class="item-name">두 번째 게임</div>
      <div class="item-tag">준비 중</div>
    </button>
    <button class="item soon" disabled>
      <div class="item-name">세 번째 게임</div>
      <div class="item-tag">준비 중</div>
    </button>
  </div>
  <footer>SONGO STUDIO</footer>
</aside>

<script>
// 마퀴 전구
const strip=document.getElementById('bulbs');
const n=Math.min(64,Math.floor(window.innerWidth/12));
for(let i=0;i<n;i++){
  const b=document.createElement('div');
  b.className='bulb';
  b.style.animationDelay=(i*0.06)+'s';
  strip.appendChild(b);
}

// 패널
const panel=document.getElementById('panel');
const scrim=document.getElementById('scrim');
function open(){panel.classList.add('on');scrim.classList.add('on');panel.setAttribute('aria-hidden','false');}
function close(){panel.classList.remove('on');scrim.classList.remove('on');panel.setAttribute('aria-hidden','true');}
document.getElementById('open').onclick=open;
document.getElementById('close').onclick=close;
scrim.onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

// 게임 데모
const DATA={a:{name:'넥슨',rev:'매출 4.0조 · 직원 7,700명',score:4.0},
            b:{name:'크래프톤',rev:'매출 2.4조 · 직원 1,900명',score:2.4}};
let streak=0,done=false;
document.querySelectorAll('.card').forEach(card=>{
  card.onclick=()=>{
    if(done)return;done=true;
    const pick=card.dataset.side;
    const win=DATA.a.score>DATA.b.score?'a':'b';
    document.querySelectorAll('.card').forEach(c=>{
      c.querySelector('[data-meta]').textContent=DATA[c.dataset.side].rev;
    });
    card.classList.add('picked');
    streak=pick===win?streak+1:0;
    document.getElementById('streak').textContent=streak;
  };
});
document.getElementById('share').onclick=()=>{
  const t=`기업 배틀 ${streak}연승`;
  navigator.clipboard?.writeText(t);
  const b=document.getElementById('share');
  b.textContent='복사했습니다';
  setTimeout(()=>b.textContent='결과 공유하기',1400);
};
</script>
</body>
</html>
